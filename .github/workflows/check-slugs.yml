name: Check article slugs

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test the slug checker
        run: node --test scripts/check-slugs.test.mjs
      - name: Test publishing workflow safety without sending a deploy request
        run: node --test scripts/publishing-workflow.test.mjs
      - name: Check article folder names
        run: node scripts/check-slugs.mjs
